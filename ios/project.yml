name: Abao
options:
  bundleIdPrefix: app.abao
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Abao:
    type: application
    platform: iOS
    sources: [Abao, Shared]
    dependencies:
      - target: AbaoLive
    info:
      path: Abao/Info.plist
      properties:
        CFBundleDisplayName: 阿寶
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSCameraUsageDescription: 拍下可疑的訊息給阿寶看
        NSMicrophoneUsageDescription: 用說的告訴阿寶
        NSPhotoLibraryUsageDescription: 選一張可疑訊息的截圖給阿寶看
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.abao.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  AbaoLive:
    type: app-extension
    platform: iOS
    sources: [AbaoLive, Shared]
    info:
      path: AbaoLive/Info.plist
      properties:
        CFBundleDisplayName: 阿寶
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.abao.ios.live
